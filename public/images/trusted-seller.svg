<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 50" width="156" height="50" fill="none">
  <!-- Shield Graphic -->
  <g transform="translate(4, 3)">
    <!-- Outer Shield Border -->
    <path d="M 22 2 C 34 2, 40 5, 41 16 C 41 29, 22 42, 22 42 C 22 42, 3 29, 3 16 C 4 5, 10 2, 22 2 Z" 
          fill="#16803c" />
    
    <!-- Inner Shield Body with Gradient -->
    <path d="M 22 4.5 C 32.5 4.5, 37.8 7.2, 38.7 16.5 C 38.7 27.5, 22 39.5, 22 39.5 C 22 39.5, 5.3 27.5, 5.3 16.5 C 6.2 7.2, 11.5 4.5, 22 4.5 Z" 
          fill="url(#shield-grad)" />

    <!-- Inner Shield Accent Line -->
    <path d="M 22 7 C 30.5 7, 35 9.2, 36 17 C 36 26, 22 36, 22 36 C 22 36, 8 26, 8 17 C 9 9.2, 13.5 7, 22 7 Z" 
          fill="#1e9e4b" />

    <!-- Stylized Checkmark -->
    <!-- Gold / Yellow Left Arm -->
    <path d="M 10 22.5 L 18.5 31 L 22.5 31 L 14 20 Z" 
          fill="#f59e0b" />
    <!-- White Right Arm -->
    <path d="M 18.5 31 L 34 14 L 35.5 16 L 20 33 Z" 
          fill="#ffffff" />
    <path d="M 12 21.5 L 19.5 29.5 L 34 14.5 L 31.5 13 L 19 26 L 14 20 Z" 
          fill="#ffffff" />
    <!-- Yellow Inner Accent on hook -->
    <polygon points="12,21.5 16,19 19,25 16,26" fill="#eab308" />
  </g>

  <!-- Typography: TRUSTED SELLER -->
  <text x="54" y="22" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="16" 
        font-weight="900" 
        letter-spacing="0.8" 
        fill="#046a38">
    TRUSTED
  </text>
  
  <text x="54" y="38" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14.5" 
        font-weight="800" 
        letter-spacing="1.2" 
        fill="#15803d">
    SELLER
  </text>

  <defs>
    <linearGradient id="shield-grad" x1="5" y1="4" x2="39" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34c759" />
      <stop offset="50%" stop-color="#28a745" />
      <stop offset="100%" stop-color="#147a38" />
    </linearGradient>
  </defs>
</svg>
